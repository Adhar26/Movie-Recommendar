<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hybrid Recommender</title>
    <style>
      body { margin:0; background:#141414; color:#fff; font-family:system-ui,sans-serif; }
      .wrap { padding:24px; }
      .bar { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
      input, button { padding:8px 12px; border-radius:6px; border:1px solid #333; background:#222; color:#fff; }
      button { cursor:pointer; } button:hover { background:#e50914; }
      .anime-toggle { display:flex; align-items:center; gap:6px; padding:0 6px; color:#ddd; font-size:14px; cursor:pointer; }
      .anime-toggle input { accent-color:#e50914; }
      .row { display:flex; gap:16px; overflow-x:auto; padding-bottom:12px; }
      .card { flex:0 0 170px; background:#1f1f1f; border-radius:8px; padding:10px; }
      .card img, .noimg { width:150px; height:225px; object-fit:cover; border-radius:6px; background:#2a2a2a; }
      .noimg { display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; color:#888; padding:6px; box-sizing:border-box; }
      .title { font-weight:bold; font-size:13px; margin-top:8px; }
      .genres { color:#aaa; font-size:11px; margin:4px 0 8px; }
      .stars { display:flex; gap:4px; } .stars button { padding:4px 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
